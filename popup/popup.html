<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <title>Ušati - Podesi uši</title>
  <style>
    :root {
      --bg: #111827;
      --card: #1f2937;
      --primary: #3b82f6;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --border: #374151;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title-group img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .badge {
      font-size: 10px;
      background: #ef4444;
      color: white;
      padding: 2px 6px;
      border-radius: 999px;
      font-weight: 600;
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #4b5563; transition: .2s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Live Preview Box */
    .preview-box {
      width: 100%;
      height: 120px;
      background: #182234;
      border: 1px solid var(--border);
      border-radius: 12px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .preview-face {
      width: 60px;
      height: 75px;
      background: #fbd38d;
      border: 3px solid #2d3748;
      border-radius: 50% 50% 45% 45%;
      position: relative;
      margin-top: 25px;
    }
    .preview-face .eye {
      width: 7px;
      height: 9px;
      background: #2d3748;
      border-radius: 50%;
      position: absolute;
      top: 28px;
    }
    .preview-face .eye.left { left: 14px; }
    .preview-face .eye.right { right: 14px; }
    .preview-face .mouth {
      width: 20px;
      height: 8px;
      border-bottom: 3px solid #2d3748;
      border-radius: 0 0 12px 12px;
      position: absolute;
      bottom: 14px;
      left: 17px;
    }
    .preview-ears {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      width: 95px;
      height: 60px;
      pointer-events: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Style Selector Grid */
    .section-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    .ear-btn {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ear-btn:hover {
      border-color: #60a5fa;
      transform: translateY(-1px);
    }
    .ear-btn.active {
      border-color: var(--primary);
      background: #1e3a8a;
    }
    .ear-icon {
      font-size: 20px;
      margin-bottom: 4px;
    }
    .ear-name {
      font-size: 10px;
      font-weight: 500;
      color: var(--text);
    }

    /* Controls */
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .slider-range {
      width: 140px;
      accent-color: var(--primary);
    }

    .footer {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <img src="../assets/icon48.png" alt="Logo">
      <div>
        <h1>Ušati <span class="badge">PRO</span></h1>
      </div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggleEnabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <!-- Live Face Preview -->
  <div class="preview-box">
    <div class="preview-face">
      <img id="previewEarsImg" class="preview-ears" src="../assets/donkey_ears.svg" alt="Uši">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
    </div>
  </div>

  <div class="section-label">Model ušiju</div>
  <div class="grid">
    <button class="ear-btn active" data-type="donkey" title="Magareće">
      <span class="ear-icon">🫏</span>
      <span class="ear-name">Magare</span>
    </button>
    <button class="ear-btn" data-type="bunny" title="Zečije">
      <span class="ear-icon">🐰</span>
      <span class="ear-name">Zeko</span>
    </button>
    <button class="ear-btn" data-type="shrek" title="Šrek">
      <span class="ear-icon">👹</span>
      <span class="ear-name">Šrek</span>
    </button>
    <button class="ear-btn" data-type="horns" title="Đavolji rogovi">
      <span class="ear-icon">😈</span>
      <span class="ear-name">Rogovi</span>
    </button>
    <button class="ear-btn" data-type="dog" title="Pseće uši">
      <span class="ear-icon">🐶</span>
      <span class="ear-name">Kuca</span>
    </button>
  </div>

  <div class="section-label">Podešavanja</div>
  
  <div class="control-row">
    <span>Veličina ušiju</span>
    <input type="range" id="earScale" class="slider-range" min="0.8" max="2.2" step="0.05" value="1.35">
  </div>

  <div class="control-row">
    <span>Animacija (mrdanje)</span>
    <label class="switch">
      <input type="checkbox" id="toggleTwitch" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="control-row">
    <span>Samo Vučić na vestima</span>
    <label class="switch">
      <input type="checkbox" id="toggleFilter" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">
    Radi automatski na YouTube prenosima i vestima
  </div>

  <script src="popup.js"></script>
</body>
</html>
